name: CI/CD – Neon Requiem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: amoba-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  DEPLOY_DIR: /home/dorina/amoba     # separate from ~/hazi-projekt on purpose
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ---------------------------------------------------------------- 1. Backend
  backend-tests:
    name: Backend – unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:                       # real DB for integration tests
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amoba
          POSTGRES_PASSWORD: amoba
          POSTGRES_DB: amoba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amoba"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (Express + PostgreSQL)
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://amoba:amoba@localhost:5432/amoba_test

  # --------------------------------------------------------------- 2. Frontend
  frontend-tests:
    name: Frontend – unit + React Testing Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # -------------------------------------------- 3. E2E against the real stack
  e2e:
    name: E2E – Playwright vs docker compose
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the 3-container stack (same compose file as production)
        run: |
          cp .env.example .env
          echo "APP_VERSION=${GITHUB_SHA}" >> .env
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8090
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------- 4. Continuous delivery: Docker Hub
  # Only tested code is published. Images are built for amd64 and arm64 (the
  # Oracle VPS) and tagged with the commit SHA (immutable, easy rollback) and `latest`.
  publish:
    name: Publish to Docker Hub (${{ matrix.image }})
    needs: [e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push amoba-${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/amoba-${{ matrix.image }}:${{ github.sha }}
            ${{ env.DOCKERHUB_USER }}/amoba-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ------------------------------------- 5. Continuous deployment: Oracle VPS
  deploy:
    name: Deploy to devops-ora.tech (ARM64)
    needs: [publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amoba.devops-ora.tech
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload compose file and scripts
        run: |
          # No source code goes to the server: it only needs the compose file (image
          # names) and the helper scripts. The source folders from the old
          # build-on-server setup are removed.
          tar czf - docker-compose.yml scripts \
            | ssh vps "mkdir -p $DEPLOY_DIR && cd $DEPLOY_DIR && rm -rf backend frontend scripts && tar xzf -"

      - name: Pull this commit's images from Docker Hub and (re)start
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh vps "cd $DEPLOY_DIR && umask 077 && cat > .env" <<EOF
          POSTGRES_DB=amoba
          POSTGRES_USER=amoba
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          FRONTEND_PORT=8090
          BACKEND_PORT=4010
          APP_VERSION=${GITHUB_SHA}
          DOCKERHUB_USER=${DOCKERHUB_USER}
          IMAGE_TAG=${GITHUB_SHA}
          EOF
          ssh vps "cd $DEPLOY_DIR \
            && docker compose pull \
            && docker compose up -d --no-build --wait --wait-timeout 300 --remove-orphans \
            && docker compose ps"

      - name: Remove older Neon Requiem images from the server
        run: |
          # Only this project's images (including the old locally built amoba-*:latest);
          # hazi-projekt images are never touched. Images still in use are skipped.
          ssh vps "docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '(^|/)amoba-(backend|frontend):' \
            | grep -v ':${GITHUB_SHA}' \
            | xargs -r docker rmi || true"

      - name: Smoke test on the server
        run: |
          ssh vps "curl -fsS http://127.0.0.1:4010/api/health && echo && curl -fsS -o /dev/null -w 'frontend HTTP %{http_code}\n' http://127.0.0.1:8090/"

      - name: Smoke test public URL (through Cloudflare + NPM)
        continue-on-error: true      # stays green until the NPM proxy host exists
        run: curl -fsS https://amoba.devops-ora.tech/api/health
