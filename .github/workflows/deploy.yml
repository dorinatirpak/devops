name: CI/CD – Neon Gothic Amőba

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: amoba-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  DEPLOY_DIR: /home/dorina/amoba     # separate from ~/hazi-projekt on purpose

jobs:
  # ---------------------------------------------------------------- 1. Backend
  backend-tests:
    name: Backend – unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:                       # real DB for integration tests
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amoba
          POSTGRES_PASSWORD: amoba
          POSTGRES_DB: amoba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amoba"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (Express + PostgreSQL)
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://amoba:amoba@localhost:5432/amoba_test

  # --------------------------------------------------------------- 2. Frontend
  frontend-tests:
    name: Frontend – unit + React Testing Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # -------------------------------------------- 3. E2E against the real stack
  e2e:
    name: E2E – Playwright vs docker compose
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the 3-container stack (same compose file as production)
        run: |
          cp .env.example .env
          echo "APP_VERSION=${GITHUB_SHA}" >> .env
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8090
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------- 4. Deploy to Oracle VPS
  deploy:
    name: Deploy to devops-ora.tech (ARM64)
    needs: [e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amoba.devops-ora.tech
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload source to the server
        run: |
          # The server has no git: ship a tarball of exactly what the images need.
          tar czf - --exclude=node_modules --exclude=dist docker-compose.yml backend frontend \
            | ssh vps "mkdir -p $DEPLOY_DIR && cd $DEPLOY_DIR && rm -rf backend frontend && tar xzf -"

      - name: Build on ARM64 and (re)start containers
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh vps "cd $DEPLOY_DIR && umask 077 && cat > .env" <<EOF
          POSTGRES_DB=amoba
          POSTGRES_USER=amoba
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          FRONTEND_PORT=8090
          BACKEND_PORT=4010
          APP_VERSION=${GITHUB_SHA}
          EOF
          ssh vps "cd $DEPLOY_DIR \
            && docker compose up -d --build --wait --wait-timeout 300 --remove-orphans \
            && docker compose ps \
            && docker image prune -f"   # removes only dangling layers (old amoba builds)

      - name: Smoke test on the server
        run: |
          ssh vps "curl -fsS http://127.0.0.1:4010/api/health && echo && curl -fsS -o /dev/null -w 'frontend HTTP %{http_code}\n' http://127.0.0.1:8090/"

      - name: Smoke test public URL (through Cloudflare + NPM)
        continue-on-error: true      # stays green until the NPM proxy host exists
        run: curl -fsS https://amoba.devops-ora.tech/api/health
